<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Nextley Agriculture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="404.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
    <div class="not-found-container">
        <div class="content-left">
            <h1 class="error-code">404</h1>
            <h2 class="error-title"><span class="oops">Oops!</span> Page Not Found</h2>
            
            <div class="divider">
                <span></span>
            </div>

            <p data-aos="fade-up" data-aos-delay="100" class="error-desc">The page you are looking for seems to have<br>wandered off the farm.</p>
            <p data-aos="fade-up" data-aos-delay="100" class="error-desc-sub">Let's get you back on track!</p>

            <div class="action-buttons" style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 30px;">
                <a href="index.html" class="btn btn-primary" style="min-width: 200px;">
                    <i class="fa-solid fa-house"></i> Go Back Home
                </a>
                <a href="#" onclick="history.back(); return false;" class="btn btn-secondary" style="min-width: 200px;">
                    <i class="fa-solid fa-arrow-left"></i> Go Back
                </a>
            </div>
        </div>
        <div class="content-right">
            <!-- Background handled by CSS -->
            <div class="wooden-sign">
                <p data-aos="fade-up" data-aos-delay="100">Good things<br>grow with<br>patience</p>
            </div>
        </div>
    </div>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu-overlay" id="mobile-menu-overlay">
        <div class="close-menu-btn" id="close-menu-btn"><i class="fa-solid fa-xmark"></i></div>
                <nav class="mobile-nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Service</a>
            <a href="blog.html">Blog</a>
            <a href="contact.html">Contact</a>
            <br><br>
            <a href="signin.html">Sign In</a>
            <a href="register.html">Register</a>
        </nav>
    </div>
                <!-- GSAP & AOS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if(typeof AOS !== 'undefined') {
                AOS.init({ once: true, offset: 50, duration: 800, easing: 'ease-out-cubic' });
            }
        });
    </script>
</body>
</html>
